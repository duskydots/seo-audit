name: manual npm release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer already committed and tagged as v<version>
        required: true
        type: string
      tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
          - beta

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-release
    steps:
      - uses: actions/checkout@v6
      - name: Require a matching immutable tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: test "$GITHUB_REF" = "refs/tags/v$RELEASE_VERSION"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run docs:generate
      - run: git diff --exit-code
      - run: bun run check
      - run: bun run test:unit
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:smoke
      - name: Verify coordinated package metadata
        run: bun run release:verify -- --version "${{ inputs.version }}" --tag "${{ inputs.tag }}"
      - name: Pack exact release archives
        run: |
          mkdir release
          bun pm pack --cwd packages/seo-audit --destination ../../release
          bun pm pack --cwd packages/cli --destination ../../release
      - name: Inspect package paths
        run: |
          tar -tzf release/duskydots-seo-audit-${{ inputs.version }}.tgz
          tar -tzf release/duskydots-seo-audit-cli-${{ inputs.version }}.tgz
      - name: Test the exact archives as a consumer
        run: |
          consumer_directory="$(mktemp -d)"
          cd "$consumer_directory"
          npm init --yes
          npm install "$GITHUB_WORKSPACE/release/duskydots-seo-audit-${{ inputs.version }}.tgz" "$GITHUB_WORKSPACE/release/duskydots-seo-audit-cli-${{ inputs.version }}.tgz"
          ./node_modules/.bin/seo-audit --help
      - uses: actions/upload-artifact@v6
        with:
          name: npm-release-${{ inputs.version }}
          path: release/*.tgz
          if-no-files-found: error
      - name: Publish engine
        run: npm publish "release/duskydots-seo-audit-${{ inputs.version }}.tgz" --access public --tag "${{ inputs.tag }}"
      - name: Publish CLI
        run: npm publish "release/duskydots-seo-audit-cli-${{ inputs.version }}.tgz" --access public --tag "${{ inputs.tag }}"
